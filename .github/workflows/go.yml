# Builds, vets and tests each Go module in this repository.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [ tictactoe, fourinarow, intersection, todo ]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ matrix.module }}/go.mod
        cache: false

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Download modules
      run: go mod download

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build ./...

    - name: Test
      run: go test ./...
